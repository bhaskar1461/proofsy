<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;background:#fff}
  .cert{width:1056px;height:746px;border:6px solid #2563EB;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:64px;background:#fff}
  .corner-tl{position:absolute;top:0;left:0;width:120px;height:120px;background:#2563EB;opacity:0.06;border-bottom-right-radius:100%}
  .corner-br{position:absolute;bottom:0;right:0;width:160px;height:160px;background:#3B82F6;opacity:0.06;border-top-left-radius:100%}
  .brand{font-size:20px;font-weight:700;color:#2563EB;letter-spacing:0.2em;text-transform:uppercase}
  .subtitle{font-size:12px;color:#94A3B8;text-transform:uppercase;letter-spacing:0.15em;margin-top:6px}
  .certify{color:#64748B;margin-top:44px;font-size:15px}
  .name-container{margin-top:12px;border-bottom:2px solid #E2E8F0;padding-bottom:6px;overflow:hidden;width:100%;max-width:650px}
  .name{font-weight:700;color:#0F172A;white-space:nowrap;line-height:1;letter-spacing:-0.01em}
  .event-label{margin-top:28px;color:#64748B;font-size:15px}
  .event-name{font-size:26px;font-weight:600;color:#2563EB;margin-top:8px}
  .duration{font-size:13px;color:#94A3B8;margin-top:4px}
  .footer{margin-top:50px;display:flex;justify-content:space-between;align-items:flex-end;width:100%;padding:0 40px}
  .footer-item{text-align:center}
  .footer-item .val{border-top:1px solid #94A3B8;padding-top:6px;font-weight:500;font-size:13px;color:#0F172A}
  .footer-item .lbl{font-size:10px;color:#94A3B8;margin-top:3px;text-transform:uppercase;letter-spacing:0.1em}
  .qr{width:70px;height:70px;border:2px solid #2563EB;display:flex;align-items:center;justify-content:center;background:#F8FAFC;margin:0 auto 6px;padding:4px}
  .qr img{width:100%;height:100%;object-fit:contain}
  .code{font-family:'Fira Code',monospace;font-size:10px;color:#2563EB}
</style></head>
<body><div class="cert"><div class="corner-tl"></div><div class="corner-br"></div>
  <div style="position:relative;z-index:1;text-align:center;width:100%;max-width:700px">
    <div class="brand">Proofsy</div>
    <div class="subtitle">Certificate of Completion</div>
    <p class="certify">This is to certify that</p>
    <div class="name-container"><div class="name" id="recipientName" style="font-size:52px">{{name}}</div></div>
    <p class="event-label">has successfully completed the</p>
    <div class="event-name">{{event}}</div>
    <div class="duration">{{duration}}</div>
    <div class="footer">
      <div class="footer-item"><div class="val">{{date}}</div><div class="lbl">Date</div></div>
      <div class="footer-item"><div class="qr"><img src="{{qrCodeDataUrl}}" alt="Verification QR" /></div><div class="code">{{verificationCode}}</div></div>
      <div class="footer-item"><div class="val">{{organizer}}</div><div class="lbl">Organizer</div></div>
    </div>
  </div>
</div>
<script>(function(){var e=document.getElementById('recipientName'),c=e.parentElement,f=52;e.style.fontSize=f+'px';while(e.scrollWidth>c.clientWidth&&f>16){f--;e.style.fontSize=f+'px'}})()</script>
</body></html>
