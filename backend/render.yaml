services:
  - type: web
    name: proofsy-backend
    env: docker
    plan: starter # Adjust plan based on required RAM for Puppeteer
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false # Set via Render dashboard (MongoDB Atlas string)
      - key: FRONTEND_URL
        sync: false # E.g., https://proofsy.vercel.app
      - key: BACKEND_URL
        sync: false # E.g., https://proofsy-backend.onrender.com
      - key: SENDGRID_API_KEY
        sync: false # Set for production emails
