# Render Blueprint — auto-configures the backend service
services:
  - type: web
    name: proofsy-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: main
    rootDir: backend
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: MONGODB_URI
        sync: false  # MongoDB Atlas connection string
      - key: JWT_SECRET
        generateValue: true
      - key: SIGNING_SECRET
        generateValue: true
      - key: REDIS_URL
        sync: false  # Optional: Upstash Redis (falls back to in-memory queue if unset)
      - key: FRONTEND_BASE_URL
        value: "https://proofsy.tech"
      - key: CORS_ORIGIN
        value: "https://proofsy.tech,https://www.proofsy.tech"
    healthCheckPath: /api/health
