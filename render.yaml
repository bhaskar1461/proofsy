# Render Blueprint — auto-configures the backend service
services:
  - type: web
    name: proofsy-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: main
    rootDir: backend
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: MONGODB_URI
        sync: false  # MongoDB Atlas connection string
      - key: JWT_SECRET
        generateValue: true
      - key: SIGNING_SECRET
        generateValue: true
      - key: REDIS_URL
        sync: false  # Optional: Upstash Redis (falls back to in-memory queue if unset)
      - key: FRONTEND_BASE_URL
        value: "https://proofsy.tech"
      - key: CORS_ORIGIN
        value: "https://proofsy.tech,https://www.proofsy.tech"
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        value: "Invitation@suh.edu.in"
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: "Invitation@suh.edu.in"
      - key: EMAIL_FROM_NAME
        value: "Proofsy Certificates"
      - key: EMAIL_REPLY_TO
        value: "bhaskar@proofsy.tech"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "qwen/qwen3.6-27b"
    healthCheckPath: /api/health
